services:
  db:
    container_name: postgres
    image: postgres:16.4
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      PGDATA: /data/postgres
    volumes:
      - postgres_data:/data/postgres
      - ./internal/db/subs_table.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: subscription-service
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: always

volumes:
  postgres_data:

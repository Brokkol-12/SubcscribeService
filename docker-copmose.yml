services:
  db:
    container_name: postgres
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /data/postgres
    volumes:
      ./postgres-data:/data/postgres
    ports:
      "5432:5432"

  app:
    build: .
    container_name: subscription-service
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8081:8081"
    restart: always

volumes:
  postgres_data: